[workspace]
members = [
    "shared",
    "keyboard",
    "keyboard-x11",
    "keyboard-portal",
    "mouse",
    "mouse-x11",
    "mouse-portal",
    "clipboard",
    "clipboard-x11",
    "clipboard-portal",
    "screen",
    "screen-x11",
    "screen-portal",
    "window",
    "process",
    "memory",
]
resolver = "2"

[profile.release]
strip = "symbols"
