[package]
name = "mechatron-window"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi6"] }
napi-derive = "2"

[target.'cfg(target_os = "linux")'.dependencies]
mechatron-shared = { path = "../shared" }
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
regex = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
regex = "1"

[build-dependencies]
napi-build = "2"
